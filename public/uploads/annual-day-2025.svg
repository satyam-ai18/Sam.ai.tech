<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#grad)" rx="16" />
  <rect width="800" height="500" fill="url(#glow)" rx="16" />

  <!-- Decorative Patterns -->
  <circle cx="100" cy="100" r="140" fill="#ffffff" fill-opacity="0.04" />
  <circle cx="720" cy="400" r="160" fill="#ffffff" fill-opacity="0.04" />
  <path d="M-20,400 Q200,340 400,380 T820,320 L820,520 L-20,520 Z" fill="#ffffff" fill-opacity="0.06" />

  <!-- Content Box -->
  <g filter="url(#shadow)" transform="translate(400, 240)">
    <!-- Icon Container Circle -->
    <circle cx="0" cy="-60" r="54" fill="#f59e0b" />
    <circle cx="0" cy="-60" r="48" fill="#ffffff" fill-opacity="0.15" />
    
    <!-- Icon Symbol -->
    <path d="M0,-80 L6,-62 L24,-62 L10,-52 L15,-35 L0,-46 L-15,-35 L-10,-52 L-24,-62 L-6,-62 Z" fill="#ffffff" />

    <!-- School Badge Pill -->
    <rect x="-110" y="16" width="220" height="28" rx="14" fill="#ffffff" fill-opacity="0.2" />
    <text x="0" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">MK CONVENT SCHOOL</text>

    <!-- Main Title -->
    <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle">Annual Day Celebrations 2025</text>
    
    <!-- Subtitle -->
    <text x="0" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#ffffff" fill-opacity="0.85" text-anchor="middle">Spectacular Cultural Dances & Awards Night</text>
  </g>
</svg>